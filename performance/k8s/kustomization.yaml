apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payflow-performance
resources:
- ../../k8s/base
- metrics-service.yaml
patches:
- path: configmap-patch.yaml
- path: deployment-patch.yaml
- path: hpa-patch.yaml
- target:
    kind: Namespace
    name: payflow
  patch: "- op: replace\n  path: /metadata/name\n  value: payflow-performance\n"
