apiVersion: apps/v1
kind: Deployment
metadata:
  name: payflow
  labels:
    app.kubernetes.io/name: payflow
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: payflow
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: payflow
      app.kubernetes.io/component: api
      app.kubernetes.io/part-of: payflow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payflow
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: payflow
    spec:
      serviceAccountName: payflow
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: payflow
                  app.kubernetes.io/component: api
                  app.kubernetes.io/part-of: payflow
              topologyKey: kubernetes.io/hostname
      containers:
      - name: payflow
        image: payflow:0.0.1-SNAPSHOT
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9091
        envFrom:
        - configMapRef:
            name: payflow-config
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          periodSeconds: 5
          timeoutSeconds: 8
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: DB_PASSWORD
        - name: API_KEY_PEPPER
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: API_KEY_PEPPER
        - name: PROVIDER_A_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: PROVIDER_A_WEBHOOK_SECRET
        - name: PROVIDER_B_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: PROVIDER_B_WEBHOOK_SECRET
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
