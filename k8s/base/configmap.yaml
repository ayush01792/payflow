apiVersion: v1
kind: ConfigMap
metadata:
  name: payflow-config
  labels:
    app.kubernetes.io/name: payflow
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: payflow
data:
  SPRING_PROFILES_ACTIVE: kubernetes
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: payflow
  DB_USERNAME: payflow
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_CONSUMER_GROUP: payflow-payment-lifecycle
  KAFKA_CONSUMER_CONCURRENCY: '1'
  KAFKA_TOPIC_PARTITIONS: '3'
  KAFKA_TOPIC_REPLICATION_FACTOR: '1'
  KAFKA_TOPIC_MIN_ISR: '1'
  OUTBOX_ENABLED: 'true'
  OUTBOX_POLL_INTERVAL_MS: '500'
  OUTBOX_BATCH_SIZE: '100'
  OUTBOX_LEASE_MS: '60000'
  OUTBOX_SEND_TIMEOUT_MS: '35000'
  RECONCILIATION_ENABLED: 'true'
  RECONCILIATION_POLL_INTERVAL_MS: '5000'
  RECONCILIATION_LEASE: 30s
  PAYMENT_CACHE_TTL_SECONDS: '300'
  PAYMENT_CREATE_RATE_LIMIT: '100'
  PAYMENT_CREATE_RATE_WINDOW_SECONDS: '60'
  PROVIDER_ROUTE_UPI: PROVIDER_A
  PROVIDER_ROUTE_CARD: PROVIDER_B
  MOCK_PROVIDERS_ENABLED: 'false'
  TRACING_SAMPLING_PROBABILITY: '0.1'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=25.0
