apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: payflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: payflow
    spec:
      containers:
      - name: postgres
        image: postgres:17.6
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1' # Measured Step 15 burst headroom; memory and connection limits unchanged.
            memory: 256Mi
        env:
        - name: POSTGRES_DB
          value: payflow
        - name: POSTGRES_USER
          value: payflow
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - payflow
            - -d
            - payflow
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      automountServiceAccountToken: false
  serviceName: postgres
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
