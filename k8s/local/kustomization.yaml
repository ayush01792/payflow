apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payflow
resources:
- ../base
- ../../observability
- postgres/service.yaml
- postgres/statefulset.yaml
- redis/service.yaml
- redis/deployment.yaml
- kafka/service.yaml
- kafka/statefulset.yaml
- observability/otel-service.yaml
- observability/otel-deployment.yaml
- observability/metrics-service.yaml
- observability/prometheus-service.yaml
- observability/prometheus-deployment.yaml
- observability/grafana-service.yaml
- observability/grafana-deployment.yaml
images:
- name: payflow
  newTag: local
patches:
- path: deployment-patch.yaml
- target:
    kind: ConfigMap
    name: payflow-config
  patch: |
    - op: replace
      path: /data/MOCK_PROVIDERS_ENABLED
      value: "true"
    - op: replace
      path: /data/PAYMENT_CREATE_RATE_LIMIT
      value: "10"
- target:
    kind: HorizontalPodAutoscaler
    name: payflow
  patch: |
    - op: replace
      path: /spec/maxReplicas
      value: 2
secretGenerator:
- name: payflow-secrets
  envs:
  - secrets.env
configMapGenerator:
- name: prometheus-config
  files:
  - prometheus.yml=observability/prometheus.yml
