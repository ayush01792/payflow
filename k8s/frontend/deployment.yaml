apiVersion: apps/v1
kind: Deployment
metadata:
  name: payflow-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payflow-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payflow-frontend
        app.kubernetes.io/component: dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: payflow-frontend:local
        imagePullPolicy: IfNotPresent
        env:
        - name: PAYFLOW_UPSTREAM
          value: http://payflow:80
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 15
        volumeMounts:
        - name: temporary
          mountPath: /tmp
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: temporary
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: nginx-config
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
